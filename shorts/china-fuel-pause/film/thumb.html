<script>
// Quick Why — "China paused its fuel exports". Thin-line map (style 17 principles) that turns into a
// thin-line diagram chain (style 16 principles). One neutral base, one accent (fuel = orange).
// Every frame is a pure function of t. All key times come from K (measured word times).
const W = 1080, H = 1920;
const P = { bg: '#EDEFED', land: '#DADFDA', edge: '#3B4045', ink: '#1C2024', mute: '#8B9399', faint: '#C2C8C4',
  card: '#FAFBFA', accent: '#D9480F', water: '#D3D9D5' };
const SANS = '"IS", system-ui, sans-serif', SERIF = '"SS4", Georgia, serif';
const cv = document.getElementById('c'), g = cv.getContext('2d');

// ---------- maths ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const mix = (a, b, k) => a + (b - a) * k;
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const es = x => x * x * (3 - 2 * x);
const spring = x => x <= 0 ? 0 : x >= 3 ? 1 : 1 - Math.exp(-6.5 * x) * Math.cos(10.5 * x);      // small overshoot
const pop = (t, k, d = .32) => spring(lin(t, k - d, k - d + .9) * 1.6);                          // lands on k with weight
const at = (t, k, d = .3) => eo(lin(t, k - d, k - .02));                                          // done by word start
const env = (t, a, b, fi = .3, fo = .3) => Math.min(eo(lin(t, a - fi, a)), 1 - eo(lin(t, b, b + fo)));
function hash(i, s) { let h = Math.imul((i | 0) ^ Math.imul(s | 0, 374761393), 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vn(x, s = 0) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return mix(hash(i, s), hash(i + 1, s), u) * 2 - 1; }
function mixHex(a, b, k) { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(mix(v, B[i], k))).join(',')})`; }

// ---------- polylines ----------
function plen(p) { const L = [0]; for (let i = 1; i < p.length; i++) L.push(L[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1])); return L; }
function ptAt(p, L, u) { const d = clamp(u) * L[L.length - 1]; let i = 1; while (i < L.length - 1 && L[i] < d) i++; const k = (d - L[i - 1]) / ((L[i] - L[i - 1]) || 1); return [mix(p[i - 1][0], p[i][0], k), mix(p[i - 1][1], p[i][1], k)]; }
function strokeTo(p, u0, u1, L = plen(p)) {
  if (u1 <= u0) return; const tot = L[L.length - 1], d0 = u0 * tot, d1 = u1 * tot;
  const a = ptAt(p, L, u0); g.beginPath(); g.moveTo(a[0], a[1]);
  for (let i = 1; i < p.length; i++) if (L[i] > d0 && L[i] < d1) g.lineTo(p[i][0], p[i][1]);
  const b = ptAt(p, L, u1); g.lineTo(b[0], b[1]); g.stroke();
}
function circ(cx, cy, r, a0 = 0, a1 = Math.PI * 2, n = 56) { const o = []; for (let i = 0; i <= n; i++) { const a = mix(a0, a1, i / n); o.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return o; }
function rect(x, y, w, h) { return [[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]]; }
function rrect(x, y, w, h, r) { const o = []; const c = [[x + w - r, y + r, -Math.PI / 2, 0], [x + w - r, y + h - r, 0, Math.PI / 2], [x + r, y + h - r, Math.PI / 2, Math.PI], [x + r, y + r, Math.PI, Math.PI * 1.5]];
  for (const [cx, cy, a0, a1] of c) o.push(...circ(cx, cy, r, a0, a1, 8)); o.push(o[0]); return o; }
function chaikin(p, n = 3) { for (let k = 0; k < n; k++) { const q = [p[0]]; for (let i = 0; i < p.length - 1; i++) { const a = p[i], b = p[i + 1]; q.push([a[0] * .75 + b[0] * .25, a[1] * .75 + b[1] * .25], [a[0] * .25 + b[0] * .75, a[1] * .25 + b[1] * .75]); } q.push(p[p.length - 1]); p = q; } return p; }
function fillPoly(p) { g.beginPath(); p.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.closePath(); g.fill(); }

// ---------- glyphs: list of shapes in local units; drawn progressively ----------
// shape = { p: points, f: fill colour or null }
const DROP = (() => { const cy = 12, r = 46, tip = [0, -78], b = Math.acos(r / (cy - tip[1]));
  return [{ p: [tip, ...circ(0, cy, r, -Math.PI / 2 + b, Math.PI * 1.5 - b, 40), tip], f: P.card }]; })();
const TRUCK = [
  { p: rect(-100, -50, 120, 75), f: P.card }, { p: [[20, 25], [20, -28], [62, -28], [92, 2], [92, 25], [20, 25]], f: P.card },
  { p: [[30, -20], [58, -20], [76, -2], [30, -2], [30, -20]] },
  { p: circ(-66, 32, 13), f: P.card }, { p: circ(-30, 32, 13), f: P.card }, { p: circ(64, 32, 13), f: P.card }, { p: [[-124, 47], [118, 47]] }];
const SHIP = [
  { p: [[-124, 0], [124, 0], [102, 42], [-106, 42], [-124, 0]], f: P.card }, { p: rect(70, -52, 36, 52), f: P.card },
  { p: rect(82, -74, 12, 22), f: P.card }, { p: circ(-80, 0, 18, Math.PI, Math.PI * 2, 12) }, { p: circ(-36, 0, 18, Math.PI, Math.PI * 2, 12) }, { p: circ(8, 0, 18, Math.PI, Math.PI * 2, 12) },
  { p: [[-150, 54], [-112, 54]] }, { p: [[112, 54], [150, 54]] }];
const TRACTOR = [
  { p: [[-40, -24], [-40, -84], [14, -84], [24, -24]], f: null }, { p: [[-10, -24], [84, -24], [84, 10], [-10, 10], [-10, -24]], f: P.card },
  { p: circ(-40, 12, 38), f: P.card }, { p: circ(-40, 12, 12) }, { p: circ(62, 30, 20), f: P.card }, { p: [[66, -24], [66, -56]] }, { p: [[-112, 50], [112, 50]] }];
const CRATE = [
  { p: circ(-34, -52, 24), f: P.card }, { p: circ(14, -56, 22), f: P.card }, { p: circ(52, -48, 18), f: P.card },
  { p: [[-34, -76], [-30, -90]] }, { p: [[14, -78], [20, -92], [36, -96]] },
  { p: rect(-84, -32, 168, 82), f: P.card }, { p: [[-84, -4], [84, -4]] }, { p: [[-84, 22], [84, 22]] }];
const PARCEL = [{ p: rect(-52, -42, 104, 84), f: P.card }, { p: [[-52, -42], [-30, -62], [74, -62], [52, -42]], f: P.card }, { p: [[74, -62], [74, 22], [52, 42]] }, { p: [[0, -42], [22, -62]] }];
const REFINERY = [{ p: [[-56, 0], [56, 0]] }, { p: rect(-8, -66, 16, 66), f: P.card }, { p: [[-44, 0], [-44, -26], ...circ(-32, -26, 12, Math.PI, Math.PI * 2, 8), [-20, 0]], f: P.card },
  { p: [[14, 0], [14, -32], ...circ(30, -32, 16, Math.PI, Math.PI * 2, 8), [46, 0]], f: P.card }];
const PUMP = [
  { p: rrect(-64, -130, 128, 232, 14), f: P.card }, { p: rrect(-42, -106, 84, 66, 8) },
  { p: [[64, -40], [92, -34], [100, -10], [100, 70]] }, { p: [[78, -62], [110, -62], [112, -44]] }, { p: [[-86, 102], [86, 102]] }, { p: [[-40, 0], [40, 0]] }];
const BAG = [
  { p: [[-30, -46], [-40, -96]] }, { p: circ(26, -70, 22), f: P.card }, { p: [[0, -50], [10, -104], [22, -112]] },
  { p: [[-66, -44], [66, -44], [54, 92], [-54, 92], [-66, -44]], f: P.card }, { p: circ(0, -44, 30, Math.PI, Math.PI * 2, 14) }];
const TAG = [{ p: [[-74, -42], [40, -42], [80, 0], [40, 42], [-74, 42], [-74, -42]], f: P.card }, { p: circ(40, 0, 8) }];
const HOUSE = [{ p: [[-54, 44], [-54, -8], [0, -54], [54, -8], [54, 44], [-54, 44]], f: P.card }, { p: rect(-14, 10, 28, 34) }];
function glyph(shapes, x, y, s, u, lw = 4.5, col = P.ink, alpha = 1) {
  if (u <= 0 || alpha <= 0) return;
  g.save(); g.translate(x, y); g.scale(s, s); g.globalAlpha *= alpha;
  g.lineWidth = lw / s; g.strokeStyle = col; g.lineCap = 'round'; g.lineJoin = 'round';
  const n = shapes.length, fk = clamp((u - .55) / .45);
  if (fk > 0) shapes.forEach(sh => { if (sh.f) { g.fillStyle = sh.f; g.globalAlpha = alpha * fk; fillPoly(sh.p); g.globalAlpha = alpha; } });
  shapes.forEach((sh, i) => strokeTo(sh.p, 0, clamp(u * (n * .55 + 1) - i * .55)));
  g.restore();
}
function word(s, x, y, size, col = P.ink, k = 1, opt = {}) {
  if (k <= 0) return 0; g.save();
  g.font = `${opt.w || 600} ${size}px ${opt.serif ? SERIF : SANS}`; g.textAlign = opt.align || 'center'; g.textBaseline = 'alphabetic';
  g.globalAlpha *= clamp(k * 1.4); g.fillStyle = col;
  const rise = (1 - eo(clamp(k))) * (opt.rise ?? 14);
  if (opt.halo) { g.lineJoin = 'round'; g.strokeStyle = P.bg; g.lineWidth = opt.halo; g.strokeText(s, x, y + rise); }
  g.fillText(s, x, y + rise); const w = g.measureText(s).width; g.restore(); return w;
}
function strike(x0, x1, y, k, lw = 10) { if (k <= 0) return; g.save(); g.strokeStyle = P.accent; g.lineWidth = lw; g.lineCap = 'round'; g.beginPath(); g.moveTo(x0, y); g.lineTo(mix(x0, x1, eio(k)), y); g.stroke(); g.restore(); }
function wobRing(cx, cy, r, u, seed, lw = 6, col = P.accent) {   // hand-drawn ring, overlaps its start like a pen
  if (u <= 0) return; const pts = [];
  for (let i = 0; i <= 90; i++) { const a = -Math.PI * .62 + i / 90 * Math.PI * 2.18, rr = r * (1 + .05 * vn(i / 9, seed) + .02 * (i / 90)); pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * .96]); }
  g.save(); g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round'; strokeTo(pts, 0, eio(u)); g.restore();
}
function arrowUp(x, y, len, k, lw = 9, col = P.accent) { if (k <= 0) return; g.save(); g.globalAlpha *= clamp(k * 2); g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round';
  const yy = y - len * eo(clamp(k)); g.beginPath(); g.moveTo(x, y); g.lineTo(x, yy); g.moveTo(x - len * .3, yy + len * .3); g.lineTo(x, yy); g.lineTo(x + len * .3, yy + len * .3); g.stroke(); g.restore(); }
function arrowDown(x, y, len, k, lw = 9, col = P.accent) { if (k <= 0) return; g.save(); g.globalAlpha *= clamp(k * 2); g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round';
  const yy = y + len * eo(clamp(k)); g.beginPath(); g.moveTo(x, y); g.lineTo(x, yy); g.moveTo(x - len * .3, yy - len * .3); g.lineTo(x, yy); g.lineTo(x + len * .3, yy - len * .3); g.stroke(); g.restore(); }

// ---------- map projection (same as map.js) ----------
const RAD = Math.PI / 180, MY0 = Math.log(Math.tan(Math.PI / 4 + MAP.lat0 * RAD / 2));
function proj(lon, lat) { return [(lon - MAP.lon0) * RAD * MAP.S, -(Math.log(Math.tan(Math.PI / 4 + lat * RAD / 2)) - MY0) * MAP.S]; }
const route = ll => { const p = chaikin(ll.map(([a, b]) => proj(a, b)), 3); return { p, L: plen(p) }; };
const R_CN = [
  [[122.2, 29.95], [125, 24], [122.5, 17.5], [120.9, 14.6]],
  [[122.2, 29.95], [129, 20], [136, 3], [147, -12], [154, -26], [151.6, -33.6]],
  [[114.6, 22.6], [112.5, 16], [108.5, 11.6], [106.8, 10.5]],
  [[114.6, 22.6], [113, 14], [108, 5], [104.2, 1.6]],
  [[114.6, 22.6], [112, 12], [105.5, 3.2], [99.5, 5], [94, 13], [91.8, 21.6]],
  [[121.6, 38.9], [123.5, 35], [125.5, 30], [126, 25], [123.5, 19]]
].map(route);
const R_ME = [
  [[56.4, 26.6], [59.5, 22.5], [64, 18], [74, 9], [80.5, 5.6], [92, 5.8], [100, 3.6], [103.5, 1.5]],
  [[56.4, 26.6], [60, 22.6], [66, 20.6], [72.6, 19.1]],
  [[56.4, 26.6], [58, 22], [53, 15], [45.5, 12.4], [41.5, 15.5], [37, 22], [33.2, 28.6]]
].map(route);
const R_RU = [
  [[28.6, 60.3], [25, 59.6], [20, 58.4], [15, 56], [11, 55.3]],
  [[37.8, 44.7], [33.5, 43.3], [29.2, 41.3], [26, 39.6], [22, 36.4]],
  [[132.9, 42.8], [134, 38], [131.5, 34.5], [129, 33.6]]
].map(route);
const RING = r => { const p = new Path2D(); for (let i = 0; i < r.length; i += 2) i ? p.lineTo(r[i], r[i + 1]) : p.moveTo(r[i], r[i + 1]); p.closePath(); return p; };
let LAND, CHINA, RUSSIA;
function buildPaths() { LAND = new Path2D(); MAP.land.forEach(r => LAND.addPath(RING(r))); CHINA = new Path2D(); MAP.china.forEach(r => CHINA.addPath(RING(r))); RUSSIA = new Path2D(); MAP.russia.forEach(r => RUSSIA.addPath(RING(r))); }
const LL = { zhoushan: [122.2, 29.95], dalian: [121.6, 38.9], huizhou: [114.6, 22.6], gulf: [52.5, 26.6], mideast: [44.5, 20.8], russia: [88, 61.5], china: [103.5, 34.5],
  calendar: [126.6, 22.2], qmark: [126.2, 34.6], refl: [122.6, 36.4] };
const WP = Object.fromEntries(Object.entries(LL).map(([k, v]) => [k, proj(...v)]));

// ---------- map camera ----------
// keys: [time, lon, lat, zoom]; zoom interpolates in log space; ease in-out between keys
function camKeys() {
  return [
    [0, 122.2, 29.95, 10], [K.now - .32, 122.2, 29.95, 10],
    [K.now + .45, 114, 21, 1.3], [K.refiners - .55, 114.5, 22, 1.36],
    [K.refiners - .08, 119.5, 30.5, 2.5], [K.stocks0 - .5, 120, 30.6, 2.62],
    [K.stocks0 - .02, 122.2, 29.95, 9], [K.world - .3, 122.2, 29.95, 9],
    [K.world + .55, 80, 30, .54], [K.war - .2, 78, 31, .56], [K.middle + .5, 66, 33, .66], [K.russia + .6, 74, 41, .62], [K.diesel3 - .1, 76, 40, .7],
    [K.watch - .5, 112, 27, 1.9], [K.watch - .02, 120, 29, 2.15], [K.pump - .2, 121, 29.5, 2.4], [DUR, 121, 29.5, 2.6]];
}
let KEYS;
function camAt(t) {
  let i = 0; while (i < KEYS.length - 2 && KEYS[i + 1][0] <= t) i++;
  const A = KEYS[i], B = KEYS[i + 1], u = eio(lin(t, A[0], B[0]));
  const a = proj(A[1], A[2]), b = proj(B[1], B[2]);
  const z = Math.exp(mix(Math.log(A[3]), Math.log(B[3]), u));
  // move the focus in proportion to log-zoom change, so big zooms feel like one continuous push
  return { x: mix(a[0], b[0], u), y: mix(a[1], b[1], u), z };
}
function driftXY(t) { const e = lin(t, 0, 1.1); return [e * (26 * Math.sin(t * .43) + 9 * Math.sin(t * 1.07 + 2)), e * (22 * Math.sin(t * .31 + 1) + 7 * Math.sin(t * .89))]; }
let CAM = { x: 0, y: 0, z: 1 };
const toS = (wx, wy) => [(wx - CAM.x) * CAM.z + W / 2, (wy - CAM.y) * CAM.z + H / 2];

// ---------- map layer ----------
function drawRoutes(set, t, state) {
  // state: {grow, off (0 flowing orange .. 1 grey dashed), probe (0..1 orange probe length), width}
  set.forEach((r, i) => {
    const grow = state.grow(i); if (grow <= 0) return;
    const off = state.off, z = CAM.z;
    g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
    g.strokeStyle = mixHex(P.accent, P.mute, off); g.lineWidth = mix(state.width || 4.2, 2.6, off) / z;
    if (off > .02) g.setLineDash([9 / z, 10 / z]);
    g.globalAlpha = mix(1, .8, off); strokeTo(r.p, 0, grow, r.L); g.setLineDash([]);
    if (state.probe > 0) { g.strokeStyle = P.accent; g.globalAlpha = 1; g.lineWidth = 4.2 / z; strokeTo(r.p, 0, state.probe * .45, r.L); }
    // tankers: filled dots riding the line; they stop and fade when the flow stops
    const flow = 1 - off;
    for (let k = 0; k < 4; k++) {
      const u = ((state.phase + k / 4 + i * .17) % 1); if (u > grow) continue;
      const a = flow * Math.min(1, Math.sin(Math.PI * u) * 3); if (a <= .02) continue;
      const q = ptAt(r.p, r.L, u); g.globalAlpha = a; g.fillStyle = P.accent; g.beginPath(); g.arc(q[0], q[1], 7 / z, 0, 7); g.fill();

function hatch(path, k, t, spacing = 16, lw = 2.2, col = P.ink, alpha = .55) {

function drawMap(t, alpha) {
  if (alpha <= 0) return;
  g.save(); g.globalAlpha = alpha;
  g.setTransform(CAM.z, 0, 0, CAM.z, W / 2 - CAM.x * CAM.z, H / 2 - CAM.y * CAM.z);
  g.fillStyle = P.land; g.fill(LAND);
  const cn = Math.max(at(t, K.china1, .5) * (1 - env(t, K.war, K.diesel3, .4, .3) * .6), 0);
  if (cn > 0) { g.fillStyle = mixHex(P.land, '#C6CCC7', cn); g.fill(CHINA); }

  if (cn > 0) { g.lineWidth = mix(1.5, 3, cn) / CAM.z; g.stroke(CHINA); }

  const ru = at(t, K.russia, .35) * (1 - lin(t, K.diesel3 - .4, K.diesel3));
  if (ru > 0) { hatch(RUSSIA, ru, t, 18, 2.2, P.ink, .38); g.setTransform(CAM.z, 0, 0, CAM.z, W / 2 - CAM.x * CAM.z, H / 2 - CAM.y * CAM.z); g.strokeStyle = P.ink; g.lineWidth = 2.6 / CAM.z; g.globalAlpha = alpha * ru; g.stroke(RUSSIA); g.globalAlpha = alpha; }

  if (me > 0) {
    const [gx, gy] = WP.gulf, ell = new Path2D(); ell.ellipse(gx, gy, 300, 210, -.2, 0, Math.PI * 2);
    hatch(ell, me, t, 18, 2.2, P.ink, .38); g.setTransform(CAM.z, 0, 0, CAM.z, W / 2 - CAM.x * CAM.z, H / 2 - CAM.y * CAM.z);
    g.globalAlpha = alpha * me; g.strokeStyle = P.ink; g.lineWidth = 2.6 / CAM.z; g.setLineDash([10 / CAM.z, 9 / CAM.z]);
    g.beginPath(); g.ellipse(gx, gy, 300, 210, -.2, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * eio(me)); g.stroke(); g.setLineDash([]); g.globalAlpha = alpha;
  }

  const phase = t * .085;
  const cnOff = eo(lin(t, K.paused - .22, K.paused + .12));
  const probe = t > K.nobody - .35 && t < K.pump ? Math.pow(Math.sin(Math.PI * clamp((t - K.nobody + .35) / 1.25 % 1)), 2) * (t < K.restart + .6 ? 1 : 0) : 0;
  drawRoutes(R_CN, t, { grow: i => eio(lin(t, K.now - .22 + i * .05, K.now + .42 + i * .05)), off: cnOff, probe, phase });
  const wide = lin(t, K.world - .2, K.world + .4);

    const meOff = eo(lin(t, K.middle - .25, K.middle + .1)), ruOff = eo(lin(t, K.russia - .25, K.russia + .1));
    drawRoutes(R_ME, t, { grow: i => eio(lin(t, K.world - .1 + i * .08, K.world + .7 + i * .08)), off: meOff, probe: 0, phase: phase * 1.2, width: 4.6 });
    drawRoutes(R_RU, t, { grow: i => eio(lin(t, K.world + .1 + i * .08, K.world + .9 + i * .08)), off: ruOff, probe: 0, phase: phase * 1.1, width: 4.6 });

  frame(K.exports1 + .6);
}
function thumbDrop() {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.fillStyle = P.bg; g.fillRect(0, 0, W, H);
  // faint map of China behind, framed on the coast
  KEYS = [[0, 112, 31, 1.55], [99, 112, 31, 1.55]]; const c = camAt(1); CAM = { x: c.x, y: c.y, z: c.z };
  g.save(); g.globalAlpha = .55; g.setTransform(CAM.z, 0, 0, CAM.z, W / 2 - CAM.x * CAM.z, H / 2 - CAM.y * CAM.z);
  g.fillStyle = P.land; g.fill(LAND); g.fillStyle = '#C6CCC7'; g.fill(CHINA); g.strokeStyle = P.edge; g.lineWidth = 1.5 / CAM.z; g.stroke(LAND); g.lineWidth = 3 / CAM.z; g.stroke(CHINA);
  g.restore();
  // big fuel drop with a pause sign beside it
  sceneHook(2.2, 1, 1.35, 430, 900);
  g.fillStyle = P.accent; g.beginPath(); g.roundRect(700, 700, 74, 300, 18); g.fill(); g.beginPath(); g.roundRect(820, 700, 74, 300, 18); g.fill();
  word('China', 540, 1440, 190, P.ink, 1, { serif: true, halo: 18, rise: 0 });
  KEYS = camKeys();
}
function thumbPoll() {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.fillStyle = P.bg; g.fillRect(0, 0, W, H);
  // pool with China's valve shut, price tag up
  scenePool(K.rest + .4, 1);
}
window.FILM.seek = t => { if (t < 1.5) thumbMap(); else if (t < 2.5) thumbDrop(); else thumbPoll(); };
